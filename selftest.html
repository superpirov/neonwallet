<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>NeonWallet selftest</title>
</head>
<body>
<pre id="results">running…</pre>
<script src="https://cdn.jsdelivr.net/npm/ethers@6.13.2/dist/ethers.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="js/networks.js"></script>
<script src="js/storage.js"></script>
<script src="js/wallet.js"></script>
<script src="js/chains.js"></script>
<script src="js/prices.js"></script>
<script src="js/neon.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
<script type="module">
const R = {};
const t = async (name, fn) => {
  try {
    const v = await fn();
    R[name] = (v === undefined || v === null || v === false) ? 'FAIL' : ('PASS' + (typeof v === 'string' ? ':' + v : ''));
  } catch (e) {
    R[name] = 'ERR:' + (e && e.message);
  }
};

await t('ethers-loaded', () => typeof window.ethers !== 'undefined');
await t('qrcode-loaded', () => typeof window.QRCode !== 'undefined');

await t('mnemonic-12-words', () => {
  const w = NW.W.generateMnemonic();
  return w.length === 12 && new Set(w).size >= 8;
});

await t('known-vector-address', () => {
  const phrase = 'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about';
  const wallet = NW.W.walletFromSecret('phrase', phrase);
  return wallet.address.toLowerCase() === '0x9858effd232b4033e47d90003d41ec34ecaeda94'
    ? 'addr-ok' : ('MISMATCH:' + wallet.address);
});

await t('classify', () =>
  NW.W.classifySecret('legal winner thank year wave sausage worth useful legal winner thank yellow') === 'phrase' &&
  NW.W.classifySecret('0x4646464646464646464646464646464646464646464646464646464646464646') === 'key' &&
  NW.W.classifySecret('hello world') === null);

await t('vault-roundtrip', async () => {
  const blob = await NW.W.encryptVault('phrase', 'a b c d e f g h i j k l', 'hunter22', '0xabc');
  try {
    await NW.W.decryptVault(blob, 'wrong');
    return false;
  } catch (e) {
    if (e.message !== 'WRONG_PASSWORD') return 'unexpected:' + e.message;
  }
  const out = await NW.W.decryptVault(blob, 'hunter22');
  return out.secret === 'a b c d e f g h i j k l' && out.type === 'phrase';
});

await t('networks-count', () => NW.Networks.all().length >= 30 ? String(NW.Networks.all().length) : false);
await t('network-selected-default', () => NW.Networks.selected().chainId === 1);

await t('ui-screens', () => {
  const fake = document.createElement('section');
  fake.className = 'screen';
  fake.id = 'screen-selftest-a';
  document.body.appendChild(fake);
  const fake2 = document.createElement('section');
  fake2.className = 'screen';
  fake2.id = 'screen-selftest-b';
  document.body.appendChild(fake2);
  NW.UI.showScreen('screen-selftest-b');
  const ok1 = fake2.classList.contains('active') && !fake.classList.contains('active');
  fake.remove(); fake2.remove();
  return ok1;
});

await t('net-list-render', () => {
  const holder = document.createElement('div');
  holder.innerHTML = '<ul id="net-list-selftest"></ul>';
  document.body.appendChild(holder);
  const orig = document.getElementById('net-list');
  const fake = holder.querySelector('#net-list-selftest');
  fake.id = '_tmp';
  fake.id = 'net-list'; // second element with same id: querySelector picks first (real one)
  // instead, temporarily replace real list content check:
  const items = (() => {
    const real = document.getElementById('net-list');
    const saved = real.innerHTML;
    NW.App.renderNetworkList('');
    const n = real.querySelectorAll('.net-item').length;
    real.innerHTML = saved;
    return n;
  })();
  holder.remove();
  return items >= 30 ? String(items) : false;
});

await t('fmt-short', () =>
  NW.W.fmtAmount(1.23456789) === '1.234568' &&
  NW.W.shortAddr('0x1234567890abcdef1234567890abcdef12345678').startsWith('0x1234'));

/* ---------- Tron (non-EVM) ---------- */
await t('tron-preset-present', () => {
  const t = NW.Networks.byId(728126428);
  return t && t.type === 'tron' && t.symbol === 'TRX' ? t.name : false;
});

await t('tron-addr-vector', () => {
  // reference value produced by tronweb.address.fromPrivateKey for the
  // BIP-44 path m/44'/195'/0'/0/0 of the abandon…about test mnemonic
  const phrase = 'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about';
  const addr = NW.Chains.addressFor({ type: 'tron' }, phrase, 'phrase', null);
  return addr === 'TUEZSdKsoDHQMeZwihtdoBiN46zxhGWYdH' ? addr : 'MISMATCH:' + addr;
});

await t('tron-addr-validate', () =>
  NW.Chains.isValidAddress({ type: 'tron' }, 'TUEZSdKsoDHQMeZwihtdoBiN46zxhGWYdH') === true &&
  NW.Chains.isValidAddress({ type: 'tron' }, 'TUEZSdKsoDHQMeZwihtdoBiN46zxhGWYdG') === false &&
  NW.Chains.isValidAddress({ type: 'tron' }, '0x9858EfFD232B4033E47d90003D41EC34EcaEda94') === false);

await t('evm-addr-unchanged', () =>
  NW.Chains.isValidAddress({ chainId: 1 }, '0x9858EfFD232B4033E47d90003D41EC34EcaEda94') === true &&
  NW.Chains.addressFor({ chainId: 1 }, 'x', 'key', '0xPASS') === '0xPASS');

/* ---------- Neon Token (demo miner, claim model) ---------- */
await t('neon-tiers', () => NW.Neon.TIERS.length === 5 && NW.Neon.TIERS[4].name === 'Diamond');

await t('neon-claim-intervals', () =>
  NW.Neon.TIERS.map(t => t.claimHours).join(',') === '1,3,6,12,24');

await t('neon-drip-and-cap', () => {
  NW.Neon.reset();
  NW.Neon.accrue();                                    // starts the cycle
  const H = NW.Neon.HOUR;
  localStorage.setItem('nw.neon.cycleStart', JSON.stringify(Date.now() - 30 * 60 * 1000));
  const half = NW.Neon.getPending();                   // ~0.0025 after 30 min
  localStorage.setItem('nw.neon.cycleStart', JSON.stringify(Date.now() - 5 * H));
  const capped = NW.Neon.getPending();                 // capped at 0.005
  const ok = Math.abs(half - 0.0025) < 1e-9 && Math.abs(capped - 0.005) < 1e-9
    && NW.Neon.isReady() && NW.Neon.getBalance() === 0; // dripping never touches balance
  NW.Neon.reset();
  return ok || ('half:' + half + ' capped:' + capped);
});

await t('neon-claim-flow', () => {
  NW.Neon.reset();
  NW.Neon.accrue();
  const H = NW.Neon.HOUR;
  localStorage.setItem('nw.neon.cycleStart', JSON.stringify(Date.now() - 30 * 60 * 1000));
  const early = NW.Neon.claim();                       // not ready yet
  localStorage.setItem('nw.neon.cycleStart', JSON.stringify(Date.now() - 2 * H));
  const full = NW.Neon.claim();                        // full cycle -> balance
  const ok = early.ok === false && full.ok === true
    && Math.abs(full.claimed - 0.005) < 1e-9
    && Math.abs(NW.Neon.getBalance() - 0.005) < 1e-9
    && NW.Neon.isReady() === false;                    // new cycle started
  NW.Neon.reset();
  return ok || JSON.stringify({ early, full, bal: NW.Neon.getBalance() });
});

await t('neon-upgrade-burns', () => {
  NW.Neon.reset();
  const blocked = NW.Neon.upgrade();                 // no balance yet
  localStorage.setItem('nw.neon.balance', JSON.stringify(300)); // 0.300
  const up = NW.Neon.upgrade();
  const ok = blocked.ok === false && up.ok === true && up.level === 2 &&
    Math.abs(NW.Neon.getBalance() - 0.05) < 1e-9 && NW.Neon.getLevel() === 2;
  NW.Neon.reset();
  return ok || JSON.stringify({ blocked, up, bal: NW.Neon.getBalance() });
});

document.getElementById('results').textContent = JSON.stringify(R);
document.title = 'SELFTEST-DONE';
</script>
</body>
</html>
